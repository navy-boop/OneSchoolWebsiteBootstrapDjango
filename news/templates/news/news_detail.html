{% load static %}

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>{{ news.title }} - 可谦学堂</title>

    <link
      href="{% static 'bootstrap/css/bootstrap.min.css' %}"
      rel="stylesheet"
    />
    <link href="{% static 'assets/css/style.css' %}" rel="stylesheet" />
  </head>

  <body class="bg-light">
    <section class="py-5">
      <div class="container">
        <article class="bg-white shadow-sm rounded p-4">
          <!-- 新闻标题 -->
          <h1 class="fw-bold text-center mb-3">{{ news.title }}</h1>

          <!-- 新闻信息 -->
          <div class="text-center text-secondary small mb-4">
            <span> 发布时间： {{ news.publish_date|date:"Y年m月d日" }} </span>

            <span class="mx-2"> | </span>

            <span> 分类： {{ news.get_category_display }} </span>
          </div>

          <hr />

          <!-- 新闻摘要 -->
          {% if news.summary %}

          <div class="bg-light rounded p-3 mb-4">
            <strong> 摘要： </strong>

            <span class="text-secondary"> {{ news.summary }} </span>
          </div>

          {% endif %}

          <!-- 新闻图片 -->
          {% if news.image %}

          <div class="text-center mb-4">
            <img
              src="{{ news.image.url }}"
              class="img-fluid rounded"
              alt="{{ news.title }}"
            />
          </div>

          {% endif %}

          <!-- 新闻正文 -->

          <div class="news-content fs-5 lh-lg">
            {{ news.content|linebreaks }}
          </div>

          <!-- 返回按钮 -->

          <div class="border-top mt-5 pt-4">
            <a href="{% url 'news' %}" class="btn btn-primary">
              ← 返回新闻中心
            </a>

            <a href="{% url 'index' %}" class="btn btn-primary ms-2">
              返回首页
            </a>
          </div>
        </article>
      </div>
    </section>

    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
