{% load static %}

<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>下载中心</title>

    <link
      href="{% static 'bootstrap/css/bootstrap.min.css' %}"
      rel="stylesheet"
    />

    <style>
      body {
        background: #f5f7fa;
        font-family: "Microsoft YaHei", sans-serif;
      }

      .download-box {
        max-width: 800px;
        margin: auto;
      }

      .page-title {
        font-size: 32px;
        font-weight: bold;
        color: #333;
      }

      .download-card {
        background: white;
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 15px;

        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);

        transition: 0.3s;
      }

      .download-card:hover {
        transform: translateY(-3px);

        box-shadow: 0 6px 15px rgba(0, 0, 0, 0.15);
      }

      .file-title {
        font-size: 20px;
        font-weight: bold;
        color: #1677ff;
      }

      .download-btn {
        background: #1677ff;

        color: white;

        border-radius: 20px;

        padding: 6px 18px;

        text-decoration: none;

        font-size: 14px;
      }

      .download-btn:hover {
        background: #0056d6;

        color: white;
      }
    </style>
  </head>

  <body>
    <div class="container py-5">
      <div class="download-box">
        <h2 class="text-center page-title mb-2">下载中心</h2>

        <p class="text-center text-muted mb-5">
          提供学校相关资料、文件及学习资源下载
        </p>
        <div class="text-center mb-4">
          <a href="{% url 'index' %}" class="btn btn-outline-primary">
            返回首页
          </a>
        </div>

        {% for file in files %}

        <div class="download-card">
          <div class="d-flex justify-content-between align-items-center">
            <div>
              <div class="file-title">{{ file.title }}</div>

              <p class="mb-0 mt-2 text-muted">{{ file.description }}</p>
            </div>

            <div>
              <a href="{{ file.file.url }}" class="download-btn" download>
                下载
              </a>
            </div>
          </div>
        </div>

        {% empty %}

        <div class="alert alert-secondary text-center">暂无下载文件</div>

        {% endfor %}
      </div>
    </div>
  </body>
</html>
