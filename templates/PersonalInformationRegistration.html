<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息登记</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            background: #f2f2f2;
            font-family: "Microsoft YaHei", sans-serif;
        }
        .title {
            text-align: center;
            font-size: 30px;
            font-weight: bold;
            margin: 40px 0;
        }
        .container {
            width: 92%;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 15px;
        }
        .item {
            margin-bottom: 25px;
        }
        .label {
            font-size: 22px;
            margin-bottom: 10px;
        }
        .input-box {
            width: 100%;
            height: 50px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 18px;
            padding-left: 15px;
        }
        textarea {
            width: 100%;
            height: 100px;
            border: 2px solid #333;
            border-radius: 8px;
            font-size: 18px;
            padding: 10px;
        }
        button {
            width: 100%;
            height: 55px;
            background: #1677ff;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 22px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1 class="title">个人信息登记</h1>
    <form method="post" action="/information/registration/">
        {% csrf_token %}
        <div class="item">
            <div class="label">姓名：</div>
            <input class="input-box" type="text" name="name">
        </div>
        <div class="item">
            <div class="label">性别：</div>
            <input class="input-box" type="text" name="gender">
        </div>
        <div class="item">
            <div class="label">年龄：</div>
            <input class="input-box" type="number" name="age">
        </div>
        <div class="item">
            <div class="label">邮箱：</div>
            <input class="input-box" type="email" name="email">
        </div>
        <div class="item">
            <div class="label">电话：</div>
            <input class="input-box" type="text" name="phone">
        </div>
        <div class="item">
            <div class="label">留言：</div>
            <textarea name="message"></textarea>
        </div>
        <button type="submit">
            提交
        </button>
    </form>
</body>
</html>
