{% load static %}
<!-- 注册模态框 -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <!-- 标题 -->
                <div class="modal-header">
                    <h5 class="modal-title" id="registerModalLabel">
                        用户注册
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭">
                    </button>
                </div>
                <!-- 注册表单 -->
                <div class="modal-body">
                    <!-- 更改为django代码 -->
                    <form id="registerForm" method="post" action="{% url 'register'%}">
                        {% csrf_token %}
                        <!-- 用户类型 -->
                        <div class="mb-3">
                            <label class="form-label">
                                注册身份
                            </label>
                            <!-- 更改为django -->
                            <select class="form-select border-secondary" name="role" required>
                                <option value="" selected>请选择注册身份</option>
                                <option value="student">学生</option>
                                <option value="parent">家长</option>
                                <option value="teacher">教师</option>
                            </select>
                        </div>
                        <!-- 用户名 -->
                        <div class="mb-3">
                            <label class="form-label ">
                                用户名
                            </label>
                            <input type="text" class="form-control border-secondary" name="username"
                                placeholder="请输入用户名" required>
                            <!-- 填错显示错误信息 -->
                            <div id="usernameError" class="text-danger small mt-1"></div>
                        </div>
                        <!-- 手机号 -->
                        <div class="mb-3">
                            <label class="form-label">
                                手机号码
                            </label>
                            <input type="tel" class="form-control border-secondary" name="phone" placeholder="请输入手机号码"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">
                                邮箱
                            </label>
                            <input type="email" class="form-control border-secondary" id="email" name="email"
                                placeholder="请输入邮箱">
                        </div>
                        <div class="mb-3">
                            <label for="age" class="form-label">
                                年龄
                            </label>
                            <input type="number" class="form-control border-secondary" id="age" name="age"
                                placeholder="请输入年龄" min="1" max="120" required>
                        </div>
                        <!-- 密码 -->
                        <div class="mb-3">
                            <label class="form-label">
                                设置密码
                            </label>
                            <input type="password" class="form-control border-secondary" name="password1"
                                placeholder="请输入密码" required>
                        </div>
                        <!-- 确认密码 -->
                        <div class="mb-3">
                            <label class="form-label">
                                确认密码
                            </label>
                            <input type="password" class="form-control border-secondary" name="password2"
                                placeholder="请再次输入密码" required>
                            <div id="passwordError" class="text-danger small mt-1"></div>
                        </div>
                        <!-- 同意协议 -->
                        <div class="form-check mb-3">
                            <input class="form-check-input border-secondary" type="checkbox" name="agreement"
                                id="agreeRegister" required>
                            <label class="form-check-label" for="agreeRegister">
                                我已阅读并同意注册协议
                            </label>
                        </div>
                        <div class="modal-footer">
                            <!-- 注册：提交 Django -->
                            <button type="submit" class="btn btn-primary">
                                立即注册
                            </button>
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                                取消
                            </button>
                        </div>
                    </form>
                </div>
                <!-- 底部按钮 -->
            </div>
        </div>
    </div>
    <!-- 留言板弹窗 -->
    <div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <form method="post" action="{% url 'message_submit' %}">
                    {% csrf_token %}
                    <!-- 标题 -->
                    <div class="modal-header">
                        <h5 class="modal-title" id="messageModalLabel">
                            在线留言
                        </h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal">
                        </button>
                    </div>
                    <!-- 内容 -->
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label">
                                姓名
                            </label>
                            <input type="text" class="form-control border-secondary" name="name" placeholder="请输入姓名">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                邮箱
                            </label>
                            <input type="email" class="form-control border-secondary" name="email" placeholder="请输入邮箱">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">
                                留言内容
                            </label>
                            <textarea class="form-control border-secondary" name="content" rows="4"
                                placeholder="请输入您的留言" required>
                            </textarea>
                        </div>
                    </div>
                    <!-- 底部按钮 -->
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                            关闭
                        </button>
                        <button type="submit" class="btn btn-primary">
                            提交留言
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <!-- 招生信息模态窗口 -->
    <div class="modal fade" id="admissionModal" tabindex="-1" aria-labelledby="admissionModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" style="background-color: #f3ead8; color: #4a3525;">
                <!-- 标题 -->
                <div class="modal-header">
                    <h5 class="modal-title" id="admissionModalLabel">
                        敬请期待！
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="关闭">
                    </button>
                </div>
                <!-- 内容 -->
                <div class="modal-body text-center">
                    <img src="{% static 'assets/images/ad/admission-animation.gif' %}" class="img-fluid"
                        style="width:400px;">
                </div>
                <!-- 底部按钮 -->
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">
                        关闭
                    </button>
                </div>
            </div>
        </div>
    </div>
    <!-- 中国地图拼图游戏窗口 -->
    <div class="modal fade" id="mapGameModal" tabindex="-1">
        <div class="modal-dialog   modal-dialog-centered modal-fullscreen-sm-down">
            <div class="modal-content">
                <!-- 标题 -->
                <div class="modal-header">
                    <h5 class="modal-title">
                        中国地图拼图
                    </h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>
                </div>
                <!-- 游戏区域 -->
                <div class="modal-body  map-game-bg">
                    <div id="mapGameArea">
                        <!-- 以后在这里写游戏代码 -->
                        <div id="puzzle" class="d-flex justify-content-center gap-2">
                        </div>
                        <div class="text-center mt-4">
                            <button class="btn btn-primary" onclick="startPuzzle()">
                                开始游戏
                            </button>
                        </div>
                    </div>
                </div>
                <!-- 底部 -->
                <div class="modal-footer puzzle-area">
                    <div id="puzzleStack"></div>
                </div>
            </div>
        </div>
    </div>
