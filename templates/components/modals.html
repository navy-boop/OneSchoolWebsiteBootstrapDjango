{% load static %}
<!-- 注册模态框 -->
<div
  class="modal fade"
  id="registerModal"
  tabindex="-1"
  aria-labelledby="registerModalLabel"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <!-- 标题 -->
      <div class="modal-header">
        <h5 class="modal-title" id="registerModalLabel">用户注册</h5>
        <button
          type="button"
          class="btn-close"
          data-bs-dismiss="modal"
          aria-label="关闭"
        ></button>
      </div>
      <!-- 注册表单 -->
      <div class="modal-body">
        <!-- 更改为django代码 -->
        <form id="registerForm" method="post" action="{% url 'register'%}">
          {% csrf_token %}
          <!-- 邀请码输入区 -->
          <div class="mb-3" style="background-color: #0b8dea; padding: 15px">
            <label class="text-white text-center d-block mb-2 fw-bold fs-5"
              >邀请码</label
            >
            <input
              type="text"
              id="invite_code"
              name="invite_code"
              class="form-control"
              placeholder="请输入邀请码"
            />
            <div id="inviteMessage" class="text-center mt-2"></div>
          </div>
          <!-- 用户类型 -->
          <div class="mb-3">
            <label class="form-label"> 注册身份 </label>
            <!-- 更改为django -->
            <select class="form-select border-secondary" name="role" required>
              <option value="" selected>请选择注册身份</option>
              <option value="student">学生</option>
              <option value="parent">家长</option>
              <option value="teacher">教师</option>
            </select>
          </div>
          <!-- 用户名 -->
          <div class="mb-3">
            <label class="form-label"> 用户名 </label>
            <input
              type="text"
              class="form-control border-secondary"
              name="username"
              placeholder="请输入用户名"
              required
            />
            <!-- 填错显示错误信息 -->
            <div id="usernameError" class="text-danger small mt-1"></div>
          </div>
          <!-- 手机号 -->
          <div class="mb-3">
            <label class="form-label"> 手机号码 </label>
            <input
              type="tel"
              class="form-control border-secondary"
              name="phone"
              placeholder="请输入手机号码"
              required
            />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label"> 邮箱 </label>
            <input
              type="email"
              class="form-control border-secondary"
              id="email"
              name="email"
              placeholder="请输入邮箱"
            />
          </div>
          <div class="mb-3">
            <label for="age" class="form-label"> 年龄 </label>
            <input
              type="number"
              class="form-control border-secondary"
              id="age"
              name="age"
              placeholder="请输入年龄"
              min="1"
              max="120"
              required
            />
          </div>
          <!-- 密码 -->
          <div class="mb-3">
            <label class="form-label"> 设置密码 </label>
            <input
              type="password"
              class="form-control border-secondary"
              name="password1"
              placeholder="请输入密码"
              required
            />
          </div>
          <!-- 确认密码 -->
          <div class="mb-3">
            <label class="form-label"> 确认密码 </label>
            <input
              type="password"
              class="form-control border-secondary"
              name="password2"
              placeholder="请再次输入密码"
              required
            />
            <div id="passwordError" class="text-danger small mt-1"></div>
          </div>
          <!-- 同意协议 -->
          <div class="form-check mb-3">
            <input
              class="form-check-input border-secondary"
              type="checkbox"
              name="agreement"
              id="agreeRegister"
              required
            />
            <label class="form-check-label" for="agreeRegister">
              我已阅读并同意注册协议
            </label>
          </div>
          <div class="modal-footer">
            <!-- 注册：提交 Django -->
            <button type="submit" class="btn btn-primary">立即注册</button>
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              取消
            </button>
          </div>
        </form>
      </div>
      <!-- 底部按钮 -->
    </div>
  </div>
</div>

<!-- 代码区 -->
<!-- 判定注册页邀请码是否输入正确 -->
<script>
  const inviteInput = document.getElementById("invite_code");
  const inviteMessage = document.getElementById("inviteMessage");
  inviteInput.addEventListener("blur", function () {
    if (inviteInput.value === "") {
      inviteMessage.innerHTML = "";
      return;
    }
    fetch("{% url 'check_invite' %}", {
      method: "POST",
      headers: {
        "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]")
          .value,
        "Content-Type": "application/x-www-form-urlencoded",
      },
      body: "invite_code=" + inviteInput.value,
    })
      .then((response) => response.json())
      .then((data) => {
        if (data.valid) {
          inviteMessage.innerHTML =
            '<span class="text-white fw-bold fs-5">邀请码正确 ✓</span>';
        } else {
          inviteMessage.innerHTML =
            '<span class="text-danger fw-bold fs-5">邀请码错误，请重新输入！</span>';
          inviteInput.value = "";
          inviteInput.focus();
        }
      });
  });
</script>

<script>
  const registerForm = document.getElementById("registerForm");

  if (registerForm) {
    registerForm.addEventListener("submit", function (e) {
      e.preventDefault();

      let formData = new FormData(this);

      fetch(this.action, {
        method: "POST",
        body: formData,
        headers: {
          "X-CSRFToken": document.querySelector("[name=csrfmiddlewaretoken]")
            .value,
        },
      })
        .then((response) => response.json())

        .then((data) => {
          if (data.success) {
            alert("注册成功");
          } else {
            alert(data.error);
          }
        });
    });
  }
</script>

<script>
  const messageForm = document.getElementById("messageForm");

  if (messageForm) {
    messageForm.addEventListener("submit", function (e) {
      e.preventDefault(); // 阻止默认提交

      let formData = new FormData(messageForm);

      fetch(messageForm.action, {
