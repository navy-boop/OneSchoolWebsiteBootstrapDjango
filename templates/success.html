<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>提交成功</title>
    <style>
        body {
            text-align: center;
            padding-top: 80px;
            font-family: "Microsoft YaHei", sans-serif;
        }
        h1 {
            font-size: 48px;
            color: #198754;
            margin-bottom: 30px;
        }
        p {
            font-size: 28px;
            margin-bottom: 40px;
        }
        a {
            display: inline-block;
            font-size: 24px;
            padding: 12px 30px;
            background-color: #0d6efd;
            color: white;
            text-decoration: none;
            border-radius: 10px;
        }
        a:hover {
            background-color: #0b5ed7;
        }
        /* 手机端 */
        @media (max-width: 576px) {
            body {
                padding-top: 100px;
            }
            h1 {
                font-size: 42px;
            }
            p {
                font-size: 26px;
            }
            a {
                font-size: 26px;
                padding: 15px 35px;
            }
        }
    </style>
</head>
<body>
    <h1>
        信息提交成功！
    </h1>
    <p>
        感谢您的填写。
    </p>
    <a href="/">
        返回首页
    </a>
</body>
</html>
