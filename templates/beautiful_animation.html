<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>美丽动画</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow: hidden;
        height: 100vh;
        background: #020617;
        font-family: "Microsoft YaHei";
      }

      /* 星空背景 */
      canvas {
        position: absolute;
        top: 0;
        left: 0;
      }

      /* 中间内容 */
      .container {
        position: absolute;
        width: 100%;
        height: 100%;

        display: flex;
        justify-content: center;
        align-items: center;

        color: white;
        text-align: center;
      }

      /* 光球 */
      .circle {
        position: absolute;

        width: 450px;
        height: 450px;

        border-radius: 50%;

        background: radial-gradient(
          circle,
          rgba(56, 189, 248, 0.8),
          rgba(168, 85, 247, 0.4),
          transparent 70%
        );

        filter: blur(20px);

        animation: rotate 8s infinite alternate;
      }

      @keyframes rotate {
        from {
          transform: translate(-80px, -50px) scale(1);
        }

        to {
          transform: translate(80px, 50px) scale(1.2);
        }
      }

      .title {
        position: relative;

        z-index: 2;

        font-size: 60px;

        letter-spacing: 10px;

        animation: show 3s ease forwards;
      }

      .subtitle {
        margin-top: 25px;

        font-size: 22px;

        color: #cbd5e1;

        animation: show 5s ease forwards;
      }

      @keyframes show {
        from {
          opacity: 0;

          transform: translateY(50px);
        }

        to {
          opacity: 1;

          transform: translateY(0);
        }
      }

      .mouse-light {
        position: absolute;

        width: 200px;

        height: 200px;

        border-radius: 50%;

        background: radial-gradient(
          circle,
          rgba(255, 255, 255, 0.35),
          transparent 70%
        );

        pointer-events: none;

        transform: translate(-50%, -50%);
      }
      .home-btn {
        display: inline-block;

        margin-top: 80px; /* 增大这里 */

        padding: 12px 35px;

        border-radius: 30px;

        text-decoration: none;

        color: white;

        font-size: 18px;

        letter-spacing: 2px;

        background: rgba(255, 255, 255, 0.15);

        border: 1px solid rgba(255, 255, 255, 0.5);

        backdrop-filter: blur(10px);

        transition: 0.4s;
      }
    </style>
  </head>

  <body>
    <canvas id="stars"></canvas>

    <div class="circle"></div>

    <div class="container">
      <div>
        <h1 class="title">可谦学堂</h1>

        <p class="subtitle">智慧 · 品格 · 成长</p>

        <a href="{% url 'index' %}"class="home-btn"> 返回首页 </a>
      </div>
    </div>

    <div class="mouse-light" id="light"></div>

    <script>
      /*
 星空粒子动画
*/

      const canvas = document.getElementById("stars");

      const ctx = canvas.getContext("2d");

      let w, h;

      function resize() {
        w = canvas.width = window.innerWidth;

        h = canvas.height = window.innerHeight;
      }

      resize();

      window.onresize = resize;

      let stars = [];

      for (let i = 0; i < 200; i++) {
        stars.push({
          x: Math.random() * w,

          y: Math.random() * h,

          size: Math.random() * 2 + 1,

          speed: Math.random() * 0.5 + 0.1,
        });
      }

      function animate() {
        ctx.clearRect(0, 0, w, h);

        stars.forEach((s) => {
          ctx.beginPath();

          ctx.fillStyle = "white";

          ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);

          ctx.fill();

          s.y -= s.speed;

          if (s.y < 0) {
            s.y = h;

            s.x = Math.random() * w;
          }
        });

        requestAnimationFrame(animate);
      }

      animate();

      /*
 鼠标光效
*/

      const light = document.getElementById("light");

      document.addEventListener("mousemove", (e) => {
        light.style.left = e.clientX + "px";

        light.style.top = e.clientY + "px";
      });
    </script>
  </body>
</html>
